<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XSIAM Practice">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22XSIAM%20Engineer%20Practice%20Exam%22%2C%22short_name%22%3A%22XSIAM%20Practice%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1115%22%2C%22theme_color%22%3A%22%230f1115%22%7D">
<title>XSIAM Engineer Practice Exam</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2c303a;
    --text: #e6e8eb;
    --muted: #9aa1ad;
    --accent: #5b8cff;
    --good: #3ddc84;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 760px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar select, .toolbar button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.primary, .toolbar button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
  .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .qtext { font-size: 1.05rem; line-height: 1.5; margin-bottom: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qimg { display: block; max-width: 100%; height: auto; margin: 0 0 18px; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
  pre.code {
    margin: 8px 0;
    padding: 10px 12px;
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 0.82rem/1.45 ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #d6e2ff;
  }
  code.inline { font: 0.9em ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; background: #0d0f13; padding: 1px 5px; border-radius: 4px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    background: #15171d;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover { border-color: var(--accent); }
  .option.selected { border-color: var(--accent); background: #16203a; }
  .option.correct { border-color: var(--good); background: #103420; }
  .option.incorrect { border-color: var(--bad); background: #3a1414; }
  .option.locked { cursor: default; }
  .option .letter { font-weight: 700; color: var(--muted); min-width: 18px; flex-shrink: 0; }
  .option .otext { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .option.correct .letter { color: var(--good); }
  .option.incorrect .letter { color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; display: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  .feedback.show { display: block; }
  .feedback.right { background: #103420; color: var(--good); }
  .feedback.wrong { background: #3a1414; color: var(--bad); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .nav .right { display: flex; gap: 10px; }
  .nav button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav button.next, .nav button.submit { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .summary { text-align: center; padding: 40px 20px; }
  .summary .score { font-size: 2.4rem; font-weight: 700; margin: 10px 0; }
  .summary button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; font-size: 0.9rem; cursor: pointer; margin: 0 4px; }
  .summary button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .review-item { text-align: left; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .review-item .tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; color: var(--bad); }
  .hidden { display: none; }
  .badge { display: inline-block; background: var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; margin-left: 8px; vertical-align: middle; }
  .disclaimer { color: var(--muted); font-size: 0.75rem; margin-top: 28px; text-align: center; }
  .option, .toolbar button, .nav button { -webkit-tap-highlight-color: transparent; }

  @media (max-width: 600px) {
    body { padding: 16px 10px; }
    h1 { font-size: 1.2rem; }
    .subtitle { font-size: 0.8rem; margin-bottom: 16px; }
    .toolbar { flex-direction: column; }
    .toolbar select, .toolbar button { width: 100%; padding: 12px 14px; font-size: 1rem; }
    .card { padding: 16px; border-radius: 12px; }
    .qtext { font-size: 1rem; }
    .option { padding: 14px; min-height: 44px; font-size: 0.95rem; }
    .feedback { font-size: 0.9rem; line-height: 1.5; }
    .nav button { flex: 1; padding: 14px 10px; font-size: 1rem; min-height: 48px; }
    .nav .right { flex: 2; }
    .progress { font-size: 0.75rem; }
    .summary { padding: 24px 12px; }
    .summary .score { font-size: 1.8rem; }
    .review-item { padding: 12px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Cortex XSIAM Engineer Practice Exam</h1>
  <div class="subtitle">Practice question engine &middot; <span id="totalCount">0</span> questions loaded</div>

  <div id="setup" class="toolbar">
    <select id="modeSelect"></select>
    <button id="startBtn" class="primary">Start</button>
    <button id="fullscreenBtn" class="hidden">Go fullscreen</button>
  </div>

  <div id="quizArea" class="hidden">
    <div class="progress">
      <span id="qPosition"></span>
      <span id="liveScore"></span>
    </div>
    <div class="bar"><div id="barFill" class="bar-fill"></div></div>

    <div class="card">
      <img id="qimg" class="qimg hidden" alt="Question figure">
      <div id="qtext" class="qtext"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div class="nav">
      <button id="restartBtn">Restart</button>
      <div class="right">
        <button id="submitBtn" class="submit hidden" disabled>Submit</button>
        <button id="nextBtn" class="next" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summary" class="summary hidden"></div>

  <div class="disclaimer">Unofficial study aid. Not affiliated with or endorsed by Palo Alto Networks.</div>
</div>

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
let order = [];
let idx = 0;
let answers = [];            // { qIndex, chosen: [originalIdx], correct }
let currentOptionOrder = []; // displayed position -> original option index
let picked = new Set();      // original option indexes selected on a multi-answer question
let answered = false;

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Plain text with optional ```fenced``` blocks and `inline code`, escaped for innerHTML.
function rich(s) {
  return String(s).split(/```[^\n]*\n?/).map((part, i) => {
    if (i % 2) return '<pre class="code">' + esc(part.replace(/\n+$/, '')) + '</pre>';
    return esc(part.replace(/^\n+|\n+$/g, '')).replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  }).join('');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sameSet(a, b) {
  return a.length === b.length && a.every(x => b.includes(x));
}

$('totalCount').textContent = QUESTIONS.length;

const MODES = [
  ['all', 'All Questions (' + QUESTIONS.length + ')'],
  ['random25', 'Random 25 Questions'],
  ['random50', 'Random 50 Questions'],
  ['exam', 'Original Practice Exam (' + QUESTIONS.filter(q => q.set === 'exam').length + ')'],
  ['study', 'Additional Study Questions (' + QUESTIONS.filter(q => q.set === 'study').length + ')'],
  ['multi', 'Choose-Two Questions Only (' + QUESTIONS.filter(q => q.correct.length > 1).length + ')']
];
MODES.forEach(([v, label]) => {
  const o = document.createElement('option');
  o.value = v; o.textContent = label;
  $('modeSelect').appendChild(o);
});

// Fullscreen API exists mainly on Android Chrome and needs a user gesture.
const fullscreenBtn = $('fullscreenBtn');
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;
if (document.documentElement.requestFullscreen && !isStandalone) {
  fullscreenBtn.classList.remove('hidden');
  fullscreenBtn.addEventListener('click', () => {
    document.documentElement.requestFullscreen().catch(() => {});
  });
}

function startRun(indices) {
  order = indices;
  idx = 0;
  answers = [];
  $('setup').classList.add('hidden');
  $('summary').classList.add('hidden');
  $('quizArea').classList.remove('hidden');
  renderQuestion();
}

$('startBtn').addEventListener('click', () => {
  const mode = $('modeSelect').value;
  let indices = QUESTIONS.map((_, i) => i);
  if (mode === 'exam') indices = indices.filter(i => QUESTIONS[i].set === 'exam');
  else if (mode === 'study') indices = indices.filter(i => QUESTIONS[i].set === 'study');
  else if (mode === 'multi') indices = indices.filter(i => QUESTIONS[i].correct.length > 1);

  if (mode === 'random25') indices = shuffle(indices).slice(0, 25);
  else if (mode === 'random50') indices = shuffle(indices).slice(0, 50);
  else indices = shuffle(indices);

  startRun(indices);
});

$('restartBtn').addEventListener('click', () => {
  $('quizArea').classList.add('hidden');
  $('summary').classList.add('hidden');
  $('setup').classList.remove('hidden');
});

$('nextBtn').addEventListener('click', () => {
  idx++;
  if (idx >= order.length) renderSummary();
  else renderQuestion();
});

$('submitBtn').addEventListener('click', () => {
  if (!answered) grade(order[idx], Array.from(picked));
});

function renderQuestion() {
  const qIndex = order[idx];
  const q = QUESTIONS[qIndex];
  const multi = q.correct.length > 1;
  answered = false;
  picked = new Set();

  $('qPosition').textContent = 'Question ' + (idx + 1) + ' of ' + order.length;
  $('liveScore').textContent = 'Score: ' + answers.filter(a => a.correct).length + '/' + answers.length;
  $('barFill').style.width = ((idx / order.length) * 100) + '%';

  const img = $('qimg');
  if (q.img) { img.src = q.img; img.classList.remove('hidden'); }
  else { img.removeAttribute('src'); img.classList.add('hidden'); }

  $('qtext').innerHTML = rich(q.q) + (multi ? '<span class="badge">Select ' + q.correct.length + '</span>' : '');

  const optionsEl = $('options');
  optionsEl.innerHTML = '';
  currentOptionOrder = shuffle(q.options.map((_, i) => i));
  currentOptionOrder.forEach((originalIndex, displayPos) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="letter">' + LETTERS[displayPos] + '</span><span class="otext">' + rich(q.options[originalIndex]) + '</span>';
    div.addEventListener('click', () => onPick(qIndex, originalIndex, div));
    optionsEl.appendChild(div);
  });

  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextBtn').disabled = true;
  $('submitBtn').classList.toggle('hidden', !multi);
  $('submitBtn').disabled = true;
}

function onPick(qIndex, originalIndex, el) {
  if (answered) return;
  const q = QUESTIONS[qIndex];
  if (q.correct.length === 1) {
    grade(qIndex, [originalIndex]);
    return;
  }
  if (picked.has(originalIndex)) {
    picked.delete(originalIndex);
    el.classList.remove('selected');
  } else if (picked.size < q.correct.length) {
    picked.add(originalIndex);
    el.classList.add('selected');
  }
  $('submitBtn').disabled = picked.size !== q.correct.length;
}

function answerText(q, list) {
  return list.slice().sort((a, b) => a - b).map(i => q.options[i]).join('\n');
}

function grade(qIndex, chosen) {
  answered = true;
  const q = QUESTIONS[qIndex];
  const isCorrect = sameSet(chosen, q.correct);
  answers.push({ qIndex, chosen, correct: isCorrect });

  document.querySelectorAll('#options .option').forEach((el, displayPos) => {
    const oi = currentOptionOrder[displayPos];
    el.classList.add('locked');
    if (q.correct.includes(oi)) el.classList.add('correct');
    if (chosen.includes(oi) && !q.correct.includes(oi)) el.classList.add('incorrect');
    if (chosen.includes(oi)) el.classList.add('selected');
  });

  const fb = $('feedback');
  fb.classList.add('show', isCorrect ? 'right' : 'wrong');
  fb.textContent = isCorrect ? 'Correct.' : 'Incorrect. The correct answer is highlighted in green.';
  if (q.explain) fb.textContent += '\n\n' + q.explain;

  $('liveScore').textContent = 'Score: ' + answers.filter(a => a.correct).length + '/' + answers.length;
  $('submitBtn').disabled = true;
  $('nextBtn').disabled = false;
  $('nextBtn').focus();
}

function renderSummary() {
  $('quizArea').classList.add('hidden');
  const summaryEl = $('summary');
  summaryEl.classList.remove('hidden');

  const total = answers.length;
  const correct = answers.filter(a => a.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  let html = '<h2>Results</h2><div class="score">' + correct + ' / ' + total + ' (' + pct + '%)</div>';

  const wrong = answers.filter(a => !a.correct);
  if (wrong.length > 0) {
    html += '<h3 style="margin-top:30px;">Review missed questions (' + wrong.length + ')</h3>';
    wrong.forEach(a => {
      const q = QUESTIONS[a.qIndex];
      html += '<div class="review-item"><div class="tag">Missed</div><div>' + rich(q.q) + '</div>'
        + '<div style="margin-top:8px; color: var(--bad);">Your answer:\n' + rich(answerText(q, a.chosen)) + '</div>'
        + '<div style="margin-top:8px; color: var(--good);">Correct answer:\n' + rich(answerText(q, q.correct)) + '</div></div>';
    });
  } else if (total > 0) {
    html += '<div style="margin-top:20px;">Perfect run. No missed questions.</div>';
  }

  html += '<div style="margin-top:30px;">'
    + (wrong.length ? '<button id="retryBtn" class="primary">Retry missed</button>' : '')
    + '<button id="againBtn">Back to start</button></div>';
  summaryEl.innerHTML = html;

  $('againBtn').addEventListener('click', () => {
    summaryEl.classList.add('hidden');
    $('setup').classList.remove('hidden');
  });
  if (wrong.length) {
    $('retryBtn').addEventListener('click', () => startRun(shuffle(wrong.map(a => a.qIndex))));
  }
}
</script>
</body>
